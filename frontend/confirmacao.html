<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmação de inscrição - ELAB</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="confirmacao">

  <main>
    <div class="conf painel">
      <div class="check" aria-hidden="true">&#10003;</div>

      <h1 id="msg-titulo">Candidatura registrada</h1>
      <p class="mut" id="msg-sub">Sua inscrição foi registrada.</p>

      <div class="conf-box">
        <p><strong>Oportunidade:</strong> <span id="conf-titulo">-</span></p>
        <p><strong>Protocolo:</strong> <code id="conf-protocolo" style="font-weight:bold; color:var(--roxo);">-</code>
        </p>
        <p><strong>Status:</strong> <span class="status-badge">Confirmada / Em análise</span></p>
        <p class="mut" style="font-size:0.86rem; margin-top:0.75rem;">
          A organização entrará em contato pelo e-mail cadastrado.
        </p>
      </div>

      <div class="acoes">
        <a class="btn" href="feed.html">Ir para o Feed</a>
        <a class="btn ghost" href="vagas.html">Explorar outras vagas</a>
        <a class="btn ghost" href="perfil.html">Ver meu perfil</a>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
