<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel da empresa - ELAB</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="empresa">

  <main>
    <div style="margin-bottom: 1.5rem;">
      <h1>Publicações da empresa</h1>
      <p class="mut">Consulte suas publicações ou cadastre uma vaga, evento ou bolsa.</p>
    </div>

    <div class="grid">
      <section>
        <h2>Minhas Publicações Recentes</h2>
        <div class="lista" id="lista">
          <div class="vazio">
            <p>Carregando publicações...</p>
          </div>
        </div>
      </section>

      <aside class="painel">
        <h2>Nova publicação</h2>
        <p class="mut" style="font-size:0.88rem;">Preencha os dados para publicar uma oportunidade.</p>

        <form>
          <label>
            Título
            <input name="titulo" required maxlength="120" placeholder="Ex: Desenvolvedora Front-end Júnior">
          </label>

          <label>
            Tipo de oportunidade
            <select name="tipo" required>
              <option value="vaga">Vaga ou estágio</option>
              <option value="evento">Evento ou oficina</option>
              <option value="palestra">Palestra</option>
              <option value="bolsa">Bolsa de estudo</option>
            </select>
          </label>

          <label>
            Local ou Modalidade
            <input name="local" maxlength="80" placeholder="Ex: Remoto, Belo Horizonte - MG ou Híbrido">
          </label>

          <label>
            Data (para eventos, palestras ou bolsas)
            <input type="date" name="data">
          </label>

          <label>
            Habilidades / Tecnologias (separadas por vírgula)
            <input name="habilidades" placeholder="Ex: JavaScript, React, Git, HTML, CSS">
          </label>

          <label>
            Descrição completa
            <textarea name="descricao" maxlength="1000"
              placeholder="Informe os requisitos e os detalhes da oportunidade."></textarea>
          </label>

          <p class="erro" role="alert"></p>
          <p class="ok" role="status"></p>

          <button class="btn block" type="submit">Publicar</button>
        </form>
      </aside>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
