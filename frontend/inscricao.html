<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscrição - ELAB</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="inscricao">

  <main>
    <div class="breadcrumb">
      <a href="feed.html">Feed</a> &gt;
      <span>Inscrição</span>
    </div>

    <div class="painel" style="max-width: 640px; margin: 0 auto;">
      <h1 id="titulo">Inscrição</h1>
      <p class="mut" id="subtitulo-inscricao">Confira a oportunidade e envie sua inscrição.</p>

      <div id="resumo-op"
        style="background: var(--bg-suave); border: 1px solid var(--borda); border-radius: var(--r); padding: 1rem; margin-bottom: 1.5rem;">
        <h3 id="resumo-titulo" style="margin:0 0 0.25rem;">Carregando oportunidade...</h3>
        <p class="mut" id="resumo-meta" style="margin:0; font-size:0.88rem;"></p>
      </div>

      <form>
        <label>
          Carta de apresentação ou mensagem de interesse (opcional)
          <textarea name="mensagem" maxlength="500"
            placeholder="Escreva por que esta oportunidade interessa a você."></textarea>
        </label>

        <label>
          Link do Portfólio, GitHub ou LinkedIn (opcional)
          <input type="url" name="link" maxlength="200" placeholder="https://github.com/seu-usuario">
        </label>

        <div style="margin: 1rem 0; font-size: 0.88rem;">
          <label
            style="display:inline-flex; align-items:flex-start; gap:0.5rem; margin:0; cursor:pointer; font-weight:normal;">
            <input type="checkbox" id="concordo-dados" required checked style="width:auto; margin-top:0.2rem;">
            <span>Autorizo o envio dos dados do meu perfil para a organização responsável pela oportunidade.</span>
          </label>
        </div>

        <p class="erro" role="alert"></p>

        <div class="acoes" style="justify-content: flex-start; margin-top: 1.5rem;">
          <button class="btn" id="enviar" type="submit">Enviar candidatura</button>
          <a class="btn ghost" href="feed.html">Cancelar e voltar ao feed</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>

</html>
